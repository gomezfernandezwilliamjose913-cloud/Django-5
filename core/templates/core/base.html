<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Inventario Django 5{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #172b4d; --muted: #718096; --accent: #4f6df5; --surface: #fff; }
        body { background: #f4f6fb; color: var(--ink); font-family: "DM Sans", sans-serif; }
        h1, h2, h3, h4, .navbar-brand { font-family: "Manrope", sans-serif; }
        .topbar { background: #14213d; }
        .brand-mark { display: inline-grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; background: #4f6df5; margin-right: 9px; }
        .page-wrap { max-width: 1240px; }
        .card { border: 1px solid #e9edf5; border-radius: 16px; }
        .stat-card { position: relative; overflow: hidden; }
        .stat-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: #eef1ff; color: var(--accent); font-weight: 700; }
        .table > :not(caption) > * > * { padding: 1rem; }
        .table thead th { color: #718096; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: #f8f9fc; border-bottom-width: 1px; }
        .btn { border-radius: 10px; font-weight: 600; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .form-control, .form-select { border-color: #e1e6ef; border-radius: 10px; padding: .65rem .8rem; }
        .form-control:focus, .form-select:focus { border-color: #9aaafa; box-shadow: 0 0 0 .2rem #4f6df520; }
        .text-muted { color: var(--muted) !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark topbar mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'core:lista_productos' %}">
                <span class="brand-mark">I</span> Inventario<span class="text-primary ms-1">.</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'core:lista_productos' %}">Productos</a>
                    <a class="nav-link" href="{% url 'core:lista_categorias' %}">Categorías</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container page-wrap pb-5">
        {% if messages %}
        <div class="messages mb-3" aria-live="polite">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show rounded-4" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% block contenido %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
