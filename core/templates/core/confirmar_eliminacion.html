{% extends 'core/base.html' %}

{% block titulo %}Eliminar producto{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h1 class="h4 mb-0">Confirmar eliminación</h1>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">¿Estás seguro de eliminar el producto <strong class="text-danger">{{ producto.nombre }}</strong>?</p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Eliminar</button>
                    <a href="{% url 'core:lista_productos' %}" class="btn btn-secondary px-4">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
